; Presente! - configuracao de compilacao do firmware.
; As versoes estao fixadas de proposito (spec, R9, R29 e HU-23): o firmware tem
; que compilar igual nas cinco maquinas. Mudar versao aqui e decisao de grupo.

[env]
platform = espressif32 @ 7.1.3
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
    miguelbalboa/MFRC522 @ 1.4.12
    bblanchon/ArduinoJson @ 6.21.6

; Cada programa de bancada mora na sua pasta em src/ e tem o seu ambiente (spec, R28).

; #14: prova de que o ambiente compila e grava na placa.
[env:ambiente]
build_src_filter = +<ambiente/>

; #25: le o UID do cracha e imprime no monitor serial.
[env:leitor]
build_src_filter = +<leitor/>

; #24: prova de vida do LED RGB e do buzzer.
[env:prova-de-vida]
build_src_filter = +<prova-de-vida/>

; #26: leitor e feedback juntos - verde, bip e uma presenca por sessao.
[env:encostou]
build_src_filter = +<encostou/>
